[project]
name = "camtrap-measure"
version = "0.1.0"
description = "Distance measurement for camera-trap deer photos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pywebview",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "pillow>=12.3.0",
    "huggingface-hub>=1.28.0",
]

[project.scripts]
camtrap-measure = "camtrap_measure.main:main"

[project.optional-dependencies]
inference = [
    "einops>=0.8.2",
    "kornia>=0.8.3",
    "loguru>=0.7.3",
    "megadetector",
    "romatch",
    "safetensors>=0.8.0",
    "speciesnet",
    "torch>=2.11",
    "torchvision",
    "transformers>=5",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camtrap_measure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# megadetector -> ultralytics-yolov5 0.1.1 pins protobuf<=3.20.1 (a 2022 yolov5 workaround; nothing here reaches
# protobuf through it), which drags onnx down to 1.12.0 - an sdist on Python 3.12 that needs CMake + Visual Studio +
# protoc to build on the dept machine. Lifting the ceiling lets onnx/protobuf resolve to versions that ship wheels
# (wandb wants protobuf<7). Seen at the first Windows install, 2026-08-21.
override-dependencies = ["protobuf>=3.20.2,<7"]

[tool.uv.sources]
romatch = { git = "https://github.com/Parskatt/RoMa.git", rev = "77f8d68803526dcddfd9b7a46bc76125bdc25f15" }
# The dept's Windows machine gets the CUDA build of torch straight from the lockfile (CUDA 12.8 wheels: any
# NVIDIA driver >= 570). Linux (HPC, dev) keeps PyPI's build; the HPC env uses the module torch anyway.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
