[project]
name = "camtrap-measure"
version = "0.1.0"
description = "Distance measurement for camera-trap deer photos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pywebview",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "pillow>=12.3.0",
    "huggingface-hub>=1.28.0",
]

[project.scripts]
camtrap-measure = "camtrap_measure.main:main"

[project.optional-dependencies]
inference = [
    "megadetector",
    "speciesnet",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camtrap_measure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
